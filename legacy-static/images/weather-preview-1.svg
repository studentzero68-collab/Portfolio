<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wbg)"/>
  <text x="600" y="80" font-family="Arial" font-size="34" fill="white" text-anchor="middle" font-weight="700">Skyline</text>
  <text x="600" y="112" font-family="Arial" font-size="15" fill="rgba(180,200,255,0.7)" text-anchor="middle">Live weather · Search any city</text>
  <!-- Search bar -->
  <rect x="320" y="140" width="560" height="52" rx="26" fill="rgba(255,255,255,0.08)" stroke="rgba(100,160,255,0.5)" stroke-width="1.5"/>
  <text x="370" y="172" font-family="Arial" font-size="15" fill="rgba(180,200,255,0.5)">City name...</text>
  <rect x="792" y="148" width="76" height="36" rx="18" fill="#2563eb"/>
  <text x="830" y="171" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Search</text>
  <!-- Weather card -->
  <rect x="300" y="224" width="600" height="400" rx="24" fill="rgba(255,255,255,0.07)" stroke="rgba(100,160,255,0.25)" stroke-width="1"/>
  <text x="600" y="288" font-family="Arial" font-size="22" fill="white" text-anchor="middle" font-weight="600">Cape Town</text>
  <text x="600" y="316" font-family="Arial" font-size="15" fill="rgba(180,200,255,0.7)" text-anchor="middle">South Africa</text>
  <!-- Temp -->
  <text x="600" y="416" font-family="Arial" font-size="88" fill="white" text-anchor="middle" font-weight="300">18°</text>
  <text x="600" y="464" font-family="Arial" font-size="18" fill="rgba(180,200,255,0.8)" text-anchor="middle">Partly Cloudy</text>
  <!-- Details row -->
  <text x="380" y="556" font-family="Arial" font-size="13" fill="rgba(180,200,255,0.6)" text-anchor="middle">Humidity</text>
  <text x="380" y="578" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="600">72%</text>
  <text x="600" y="556" font-family="Arial" font-size="13" fill="rgba(180,200,255,0.6)" text-anchor="middle">Wind</text>
  <text x="600" y="578" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="600">14 km/h</text>
  <text x="820" y="556" font-family="Arial" font-size="13" fill="rgba(180,200,255,0.6)" text-anchor="middle">Feels like</text>
  <text x="820" y="578" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="600">15°</text>
  <text x="600" y="756" font-family="Arial" font-size="12" fill="rgba(140,160,200,0.6)" text-anchor="middle">Weather App — React + Vite · Weatherstack API · Custom hooks · Error handling</text>
</svg>
