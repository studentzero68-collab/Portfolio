<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#0f0a1a"/>
  <rect x="0" y="0" width="1200" height="60" fill="rgba(10,6,20,0.98)"/>
  <text x="40" y="38" font-family="Arial" font-size="22" fill="white" font-weight="700">ShopCenter</text>
  <text x="840" y="38" font-family="Arial" font-size="14" fill="#c0b0d8">Cart (3)</text>
  <!-- Cart layout -->
  <text x="40" y="108" font-family="Arial" font-size="26" fill="white" font-weight="700">Your Cart</text>
  <!-- Cart items -->
  <rect x="40" y="132" width="720" height="100" rx="12" fill="rgba(26,18,44,0.9)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <rect x="60" y="152" width="70" height="60" rx="8" fill="rgba(80,40,120,0.4)"/>
  <text x="152" y="176" font-family="Arial" font-size="14" fill="white" font-weight="600">Premium Headphones</text>
  <text x="152" y="198" font-family="Arial" font-size="13" fill="#a855f7">$49.99</text>
  <text x="680" y="188" font-family="Arial" font-size="14" fill="white" text-anchor="end">Qty: 1</text>
  <rect x="40" y="248" width="720" height="100" rx="12" fill="rgba(26,18,44,0.9)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <rect x="60" y="268" width="70" height="60" rx="8" fill="rgba(40,60,100,0.4)"/>
  <text x="152" y="292" font-family="Arial" font-size="14" fill="white" font-weight="600">Slim Fit Jacket</text>
  <text x="152" y="314" font-family="Arial" font-size="13" fill="#a855f7">$29.99</text>
  <text x="680" y="304" font-family="Arial" font-size="14" fill="white" text-anchor="end">Qty: 2</text>
  <!-- Order summary -->
  <rect x="800" y="132" width="360" height="320" rx="16" fill="rgba(26,18,44,0.95)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
  <text x="980" y="172" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="700">Order Summary</text>
  <line x1="820" y1="188" x2="1140" y2="188" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="820" y="218" font-family="Arial" font-size="13" fill="#a89ab8">Subtotal</text>
  <text x="1140" y="218" font-family="Arial" font-size="13" fill="white" text-anchor="end">$109.97</text>
  <text x="820" y="248" font-family="Arial" font-size="13" fill="#a89ab8">VAT (15%)</text>
  <text x="1140" y="248" font-family="Arial" font-size="13" fill="white" text-anchor="end">$16.50</text>
  <text x="820" y="278" font-family="Arial" font-size="13" fill="#a89ab8">Delivery</text>
  <text x="1140" y="278" font-family="Arial" font-size="13" fill="#22c55e" text-anchor="end">Free</text>
  <line x1="820" y1="296" x2="1140" y2="296" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="820" y="324" font-family="Arial" font-size="16" fill="white" font-weight="700">Total</text>
  <text x="1140" y="324" font-family="Arial" font-size="16" fill="white" font-weight="700" text-anchor="end">$126.47</text>
  <rect x="820" y="348" width="320" height="48" rx="24" fill="#7c3aed"/>
  <text x="980" y="377" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="600">Checkout</text>
  <text x="600" y="776" font-family="Arial" font-size="12" fill="rgba(160,140,180,0.6)" text-anchor="middle">Shopping Center — Cart · VAT calculation · Delivery total · Checkout flow</text>
</svg>
