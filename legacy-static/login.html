<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login | Mukelani</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body class="portfolio-ready">
    <div class="page-bg" aria-hidden="true"></div><div class="page-bg-overlay" aria-hidden="true"></div>
    <div class="page-wrapper auth-page">
        <header class="navbar"><a href="index.html" class="logo">Mukelani</a><a href="projects.html" class="nav-link">Back to portfolio</a></header>
        <main class="auth-panel">
            <p class="eyebrow">Portfolio owner</p>
            <h1>Sign in</h1>
            <p class="auth-intro">Manage the projects shown on your public portfolio.</p>
            <form id="login-form" class="auth-form">
                <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
                <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="btn" type="submit">Sign in</button>
                <p id="login-status" class="form-status" role="alert"></p>
            </form>
        </main>
    </div>
    <script src="auth.js"></script>
</body>
</html>
