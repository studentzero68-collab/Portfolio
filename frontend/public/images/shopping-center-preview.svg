<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sbg)"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="rgba(10,6,20,0.98)"/>
  <text x="40" y="38" font-family="Arial" font-size="22" fill="white" font-weight="700">ShopCenter</text>
  <text x="700" y="38" font-family="Arial" font-size="14" fill="#c0b0d8">Home</text>
  <text x="770" y="38" font-family="Arial" font-size="14" fill="#c0b0d8">Shop</text>
  <text x="840" y="38" font-family="Arial" font-size="14" fill="#c0b0d8">Cart (3)</text>
  <rect x="960" y="14" width="96" height="32" rx="16" fill="#7c3aed"/>
  <text x="1008" y="35" font-family="Arial" font-size="13" fill="white" text-anchor="middle">Sign in</text>
  <!-- Search bar -->
  <rect x="40" y="80" width="760" height="44" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(139,56,220,0.4)" stroke-width="1"/>
  <text x="68" y="107" font-family="Arial" font-size="14" fill="#888">Search products...</text>
  <!-- Category filters -->
  <rect x="40" y="144" width="120" height="36" rx="18" fill="#7c3aed"/>
  <text x="100" y="167" font-family="Arial" font-size="13" fill="white" text-anchor="middle">All</text>
  <rect x="172" y="144" width="140" height="36" rx="18" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="242" y="167" font-family="Arial" font-size="13" fill="#c0b0d8" text-anchor="middle">Electronics</text>
  <rect x="324" y="144" width="140" height="36" rx="18" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="394" y="167" font-family="Arial" font-size="13" fill="#c0b0d8" text-anchor="middle">Clothing</text>
  <rect x="476" y="144" width="140" height="36" rx="18" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="546" y="167" font-family="Arial" font-size="13" fill="#c0b0d8" text-anchor="middle">Jewellery</text>
  <!-- Product grid -->
  <rect x="40"  y="204" width="256" height="300" rx="14" fill="rgba(26,18,44,0.9)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <rect x="40"  y="204" width="256" height="160" rx="14" fill="rgba(80,40,120,0.3)"/>
  <text x="168" y="296" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Product image</text>
  <text x="60"  y="390" font-family="Arial" font-size="13" fill="white" font-weight="600">Premium Headphones</text>
  <text x="60"  y="412" font-family="Arial" font-size="13" fill="#a855f7" font-weight="700">$49.99</text>
  <rect x="60"  y="428" width="100" height="32" rx="16" fill="#7c3aed"/>
  <text x="110" y="449" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Add to cart</text>
  <rect x="312" y="204" width="256" height="300" rx="14" fill="rgba(26,18,44,0.9)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <rect x="312" y="204" width="256" height="160" rx="14" fill="rgba(40,60,100,0.3)"/>
  <text x="440" y="296" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Product image</text>
  <text x="332" y="390" font-family="Arial" font-size="13" fill="white" font-weight="600">Slim Fit Jacket</text>
  <text x="332" y="412" font-family="Arial" font-size="13" fill="#a855f7" font-weight="700">$29.99</text>
  <rect x="332" y="428" width="100" height="32" rx="16" fill="#7c3aed"/>
  <text x="382" y="449" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Add to cart</text>
  <rect x="584" y="204" width="256" height="300" rx="14" fill="rgba(26,18,44,0.9)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <rect x="584" y="204" width="256" height="160" rx="14" fill="rgba(100,40,40,0.3)"/>
  <text x="712" y="296" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Product image</text>
  <text x="604" y="390" font-family="Arial" font-size="13" fill="white" font-weight="600">Gold Earrings</text>
  <text x="604" y="412" font-family="Arial" font-size="13" fill="#a855f7" font-weight="700">$17.99</text>
  <rect x="604" y="428" width="100" height="32" rx="16" fill="#7c3aed"/>
  <text x="654" y="449" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Add to cart</text>
  <!-- Pagination -->
  <text x="600" y="552" font-family="Arial" font-size="13" fill="#a89ab8" text-anchor="middle">Showing 1 – 8 of 20 products</text>
  <rect x="516" y="566" width="40" height="32" rx="8" fill="#7c3aed"/>
  <text x="536" y="587" font-family="Arial" font-size="14" fill="white" text-anchor="middle">1</text>
  <rect x="566" y="566" width="40" height="32" rx="8" fill="rgba(124,58,237,0.2)"/>
  <text x="586" y="587" font-family="Arial" font-size="14" fill="#c0b0d8" text-anchor="middle">2</text>
  <rect x="616" y="566" width="40" height="32" rx="8" fill="rgba(124,58,237,0.2)"/>
  <text x="636" y="587" font-family="Arial" font-size="14" fill="#c0b0d8" text-anchor="middle">3</text>
  <text x="600" y="776" font-family="Arial" font-size="12" fill="rgba(160,140,180,0.6)" text-anchor="middle">Shopping Center — React · Context API · Product filters · Pagination</text>
</svg>
